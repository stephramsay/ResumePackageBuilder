description: >
  Canonical bank of resume skills the analyzer can prefilter against each job
  description. Keep skills reusable and non-duplicative; basic tools such as
  Jira, Confluence, SQL, YAML, Agile, and Scrum should stay deprioritized unless
  the job description explicitly asks for them.
